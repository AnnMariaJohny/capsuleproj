services:
  - type: web
    name: reloop-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: MONGODB_URI
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
